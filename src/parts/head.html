<!-- Field styles: Tailwind 3 compiled from the original Blade classes; enabled only on technician pages -->
<style id="nv-tw" data-mode="field">__TWCSS__</style>
<style data-mode="field">
body.nv-field{font-family:"Cairo",sans-serif;transition:background-color .3s ease}
body.nv-field.nv-en{font-family:"Inter",sans-serif}
[x-cloak]{display:none!important}
.cursor-zoom-in{cursor:zoom-in}.cursor-zoom-out{cursor:zoom-out}
#map,#location-map{height:300px;width:100%;border-radius:.75rem;border:1px solid #e5e7eb;z-index:1}
</style>
<style data-mode="admin" media="not all">
.bg-info-subtle{background-color:rgba(13,202,240,.1)}
.btn-xs{padding:.2rem .5rem;font-size:.75rem;border-radius:.2rem}
.cursor-pointer{cursor:pointer}
.transition{transition:all .25s ease-in-out}
.hover-scale:hover{transform:translateY(-4px);box-shadow:0 1rem 3rem rgba(0,0,0,.175)!important}
.hover-zoom:hover{transform:scale(1.1);transition:transform .2s;z-index:10}
.btn-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;padding:0}
.avatar-xs{width:24px;height:24px}
.breadcrumb-item+.breadcrumb-item::before{content:"›"}
#location-map{height:300px;width:100%;border-radius:.375rem;border:1px solid #dee2e6;z-index:1}
body.login-page{background:linear-gradient(135deg,#f5f7fa 0%,#c3cfe2 100%)}
.login-page .login-box{width:400px;max-width:calc(100vw - 32px)}
.login-page .login-logo a{color:#495057}
.login-page .login-logo img{filter:drop-shadow(0 4px 6px rgba(0,0,0,.1));transition:transform .3s ease}
.login-page .login-logo a:hover img{transform:scale(1.05)}
.login-page .card{border-radius:15px;overflow:hidden}
.login-page .login-card-body{border-radius:15px}
.login-page .btn-primary{border-radius:10px;padding:10px;font-weight:600;background:#007bff;border:none;transition:all .3s ease}
.login-page .btn-primary:hover{background:#0056b3;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,123,255,.3)}
.login-page .input-group-text{background-color:#f8f9fa;border-left:none;color:#adb5bd}
.login-page .form-control{border-right:none;padding:12px;border-radius:10px 0 0 10px}
.login-page .form-control:focus{box-shadow:none;border-color:#dee2e6}
</style>
<style id="nv-rkz-field" data-mode="field">
/* NV6 — RakizoraFM identity on the technician pages: Cairo, navy / blue / purple, rounded cards with a gradient top line */
body.nv-field,body.nv-field.nv-en{font-family:Cairo,Tahoma,sans-serif;background:#f8fafc;color:#0f172a}
body.nv-field>#app>header{border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#2563eb,#7c3aed) 1;box-shadow:0 2px 12px rgba(15,23,42,.06)}
body.nv-field header h1{color:#0f172a;font-weight:800}
body.nv-field main section>.bg-white{position:relative;border-radius:22px;box-shadow:0 18px 50px rgba(15,23,42,.08)}
body.nv-field main section>.bg-white::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;border-radius:22px 22px 0 0;background:linear-gradient(90deg,#0ea5e9,#2563eb,#7c3aed)}
body.nv-field .bg-blue-600{background-image:linear-gradient(135deg,#2563eb,#1d4ed8)}
body.nv-field .bg-blue-600:hover{background-image:linear-gradient(135deg,#1d4ed8,#1e3a8a)}
body.nv-field .bg-green-600{background-image:linear-gradient(135deg,#10b981,#059669)}
body.nv-field footer{color:#94a3b8}
/* sign-in: the start-page gradient (navy → blue → purple), no top bar */
body.nv-field.nv-auth{background:linear-gradient(135deg,#0f172a,#1e3a8a 60%,#4c1d95)}
body.nv-field.nv-auth>#app>header{display:none}
body.nv-field.nv-auth footer,body.nv-field.nv-auth footer a{color:rgba(255,255,255,.65)}
</style>
<style id="nv-rkz-admin" data-mode="admin" media="not all">
/* NV6 — RakizoraFM identity on the admin pages (AdminLTE 4 layout kept): Cairo, primary #2563eb, white sidebar with blue pills */
:root{--bs-primary:#2563eb;--bs-primary-rgb:37,99,235;--bs-link-color:#2563eb;--bs-link-color-rgb:37,99,235;--bs-link-hover-color:#1d4ed8;--bs-body-font-family:Cairo,Tahoma,system-ui,sans-serif;--bs-border-radius:.6rem}
body.layout-fixed,body.login-page{font-family:Cairo,Tahoma,system-ui,sans-serif}
.btn-primary{--bs-btn-bg:#2563eb;--bs-btn-border-color:#2563eb;--bs-btn-hover-bg:#1d4ed8;--bs-btn-hover-border-color:#1d4ed8;--bs-btn-active-bg:#1e3a8a;--bs-btn-active-border-color:#1e3a8a}
.btn-outline-primary{--bs-btn-color:#2563eb;--bs-btn-border-color:#2563eb;--bs-btn-hover-bg:#2563eb;--bs-btn-hover-border-color:#2563eb;--bs-btn-active-bg:#1d4ed8}
.text-primary{color:#2563eb!important}.border-primary{border-color:#2563eb!important}
.bg-primary-subtle{background-color:#eff6ff!important}.text-bg-primary{background:#2563eb!important}
.bg-primary{background:linear-gradient(135deg,#2563eb,#1d4ed8)!important}
.bg-success{background:linear-gradient(135deg,#10b981,#059669)!important}
.bg-info{background:linear-gradient(135deg,#7c3aed,#6d28d9)!important}
.bg-secondary{background:linear-gradient(135deg,#64748b,#475569)!important}
.app-header{border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#2563eb,#7c3aed) 1}
.app-sidebar.nv-rkz{background:#fff!important;border-inline-end:1px solid #e2e8f0}
.app-sidebar.nv-rkz .sidebar-brand{border-bottom:1px solid #e2e8f0}
.app-sidebar.nv-rkz .nav-header{color:#94a3b8;font-weight:800;font-size:.72rem;letter-spacing:.04em}
.app-sidebar.nv-rkz .nav-link{color:#334155;font-weight:700;border-radius:12px;margin:1px 8px}
.app-sidebar.nv-rkz .nav-link .nav-icon{color:#2563eb}
.app-sidebar.nv-rkz .nav-link:hover{background:#f1f5f9;color:#0f172a}
.app-sidebar.nv-rkz .nav-link.active{background:#eff6ff!important;color:#1d4ed8!important;box-shadow:none}
.app-sidebar.nv-rkz .nav-treeview .nav-link{font-weight:600}
.app-main .card{border-radius:16px;box-shadow:0 8px 28px rgba(15,23,42,.06)!important}
.app-main .card>.card-header:first-child{border-radius:16px 16px 0 0}
.app-content-header h3{font-weight:800;color:#0f172a}
.app-footer a,.app-footer strong{color:#1e3a8a}
body.login-page{background:linear-gradient(135deg,#0f172a,#1e3a8a 60%,#4c1d95)!important}
.login-page .card{border-radius:22px!important}
.login-page .btn-primary{background:#2563eb;border-radius:12px}
.login-page .btn-primary:hover{background:#1d4ed8}
.login-page .login-logo img{background:#fff;padding:10px 14px;border-radius:16px}
[data-bs-theme=dark] .app-sidebar.nv-rkz{background:#0f172a!important;border-color:#1e293b}
[data-bs-theme=dark] .app-sidebar.nv-rkz .nav-link{color:#cbd5e1}
[data-bs-theme=dark] .app-sidebar.nv-rkz .nav-link.active{background:#1e3a8a!important;color:#fff!important}
[data-bs-theme=dark] .app-sidebar.nv-rkz .sidebar-brand{background:#fff}
</style>
<style>
.nv-toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:12px;z-index:3000;font-weight:700;max-width:90vw;font-family:inherit}
</style>
